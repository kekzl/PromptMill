name: Publish images

# Publishes the prebuilt CPU and GPU images to GHCR so users never have to
# compile llama-cpp-python themselves.
#
# Tags:
#   ghcr.io/kekzl/promptmill:cpu        latest CPU build from master
#   ghcr.io/kekzl/promptmill:gpu        latest GPU build from master
#   ghcr.io/kekzl/promptmill:X.Y.Z-cpu  release build (git tag vX.Y.Z)
#   ghcr.io/kekzl/promptmill:X.Y.Z-gpu  release build (git tag vX.Y.Z)

# Note on triggers: the auto-merge workflow enables auto-merge with
# GITHUB_TOKEN, and a merge performed that way does NOT trigger further
# workflow runs. A plain merge to master therefore never publishes on its own.
# Publishing a GitHub release, or pushing a v* tag with your own credentials,
# does trigger this; workflow_dispatch covers everything else.
on:
  push:
    branches: [master]
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    name: ${{ matrix.variant }} image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: cpu
            dockerfile: Dockerfile.cpu
          - variant: gpu
            dockerfile: Dockerfile.gpu
    steps:
      - uses: actions/checkout@v7

      # The CUDA devel image plus the build tree does not fit next to the
      # runner's preinstalled toolchains.
      - name: Free disk space
        if: matrix.variant == 'gpu'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # master -> :cpu / :gpu, git tag vX.Y.Z -> :X.Y.Z-cpu and :X.Y-cpu as well.
      - name: Compute tags
        id: tags
        env:
          BASE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          VARIANT: ${{ matrix.variant }}
          REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          BASE="${BASE,,}"
          TAGS="${BASE}:${VARIANT}"
          VERSION=""
          if [[ "$REF" == refs/tags/v* ]]; then
            VERSION="${REF#refs/tags/v}"
          elif [[ "$RELEASE_TAG" == v* ]]; then
            VERSION="${RELEASE_TAG#v}"
          fi
          if [[ -n "$VERSION" ]]; then
            TAGS="${TAGS},${BASE}:${VERSION}-${VARIANT},${BASE}:${VERSION%.*}-${VARIANT}"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "Publishing: ${TAGS}"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
